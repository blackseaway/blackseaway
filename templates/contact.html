{% extends "base.html" %}
{% set page_id = 'contact' %}
{% set title = t.contact_title %}
{% block content %}
<div class="wrap article">
  <h1>{{ t.contact_title }}</h1>
  <p class="lead">{{ t.contact_intro }}</p>
  <form class="contact-form" action="https://formsubmit.co/{{ cfg.contact_email }}" method="POST">
    <input type="hidden" name="_subject" value="Black Sea Way: new message ({{ lang|upper }})">
    <input type="hidden" name="_next" value="{{ cfg.base_url }}/{{ lang }}/thanks.html">
    <input type="hidden" name="_template" value="table">
    <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label>{{ t.f_name }}<input type="text" name="name" required maxlength="120" autocomplete="name"></label>
    <label>{{ t.f_email }}<input type="email" name="email" required maxlength="200" autocomplete="email"></label>
    <label>{{ t.f_topic }}<select name="topic">{% for o in t.f_topics %}<option>{{ o }}</option>{% endfor %}</select></label>
    <label>{{ t.f_message }}<textarea name="message" rows="7" required maxlength="5000"></textarea></label>
    <button class="button primary" type="submit">{{ t.f_send }}</button>
    <p class="note">{{ t.f_privacy }}</p>
  </form>
  <p>{{ t.or_email }} <a class="mail" href="mailto:{{ cfg.contact_email }}">{{ cfg.contact_email }}</a></p>
</div>
{% endblock %}
