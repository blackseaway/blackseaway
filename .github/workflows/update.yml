name: Update site

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      post_social:
        description: "Post to social media in this run"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      has_post: ${{ steps.prepare.outputs.has_post }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore picture cache
        uses: actions/cache@v4
        with:
          path: media
          key: media-${{ github.run_id }}
          restore-keys: media-

      - name: Collect news
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python -u scripts/fetch_news.py 2>&1 | tee data/fetch_log.txt

      - name: Sea conditions
        continue-on-error: true
        run: python -u scripts/fetch_weather.py 2>&1 | tee -a data/fetch_log.txt

      - name: Choose next social post
        id: prepare
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.post_social)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/social_post.py prepare

      - name: Build site
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/build.py

      - name: Save collected data
        run: |
          git config user.name "Black Sea Way bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "Update news data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  social:
    needs: [update, deploy]
    if: needs.update.outputs.has_post == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish to Facebook, Instagram and Threads
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/social_post.py publish
      - name: Save posting log
        if: always()
        run: |
          git config user.name "Black Sea Way bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social_state.json data/social_queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Social posting log"
          git pull --rebase origin main
          git push origin HEAD:main
