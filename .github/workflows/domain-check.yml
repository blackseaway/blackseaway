name: Domain availability check
on:
  push:
    branches: [main]
    paths: [".github/workflows/domain-check.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: RDAP lookups (200 = registered, 404 = free)
        run: |
          : > data/domain_check.txt
          for d in blackseaway.io blackseaway.com blackseaway.eu blackseaway.org blackseaway.news blackseaway.media blackseaway.net blackseaway.info \
                   blackseawaymedia.com blackseawaymedia.io blackseawaymedia.eu black-sea-way.com blacksea-way.com blackseaway.co; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" -L -m 25 -H "Accept: application/rdap+json" "https://rdap.org/domain/$d")
            exp=$(python3 -c "import json;d=json.load(open('/tmp/r.json'));print(next((e['eventDate'] for e in d.get('events',[]) if e.get('eventAction')=='expiration'),''))" 2>/dev/null)
            echo "$d $code $exp" | tee -a data/domain_check.txt
            sleep 1
          done
          git config user.name "Black Sea Way bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/domain_check.txt && git commit -m "Domain availability check" && git pull --rebase -X theirs origin main && git push origin HEAD:main
