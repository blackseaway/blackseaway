name: Contact form test message

# Sends one test message through FormSubmit from GitHub's servers.
# The first message to a new address makes FormSubmit email an activation link
# to blackseaway@atomicmail.io. Run it again any time to test the form.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/activate-form.yml"]

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send test message
        run: |
          EMAIL=$(python3 -c "import json;print(json.load(open('config/site.json'))['contact_email'])")
          RES=$(curl -sS -m 30 -X POST "https://formsubmit.co/ajax/$EMAIL" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -H "Referer: https://blackseaway.github.io/blackseaway/en/contact.html" \
            -H "Origin: https://blackseaway.github.io" \
            -d '{"name":"Black Sea Way test","email":"'"$EMAIL"'","topic":"Test","message":"Test message from the website contact form setup. If you see this, the form works.","_subject":"Black Sea Way: contact form test"}' || true)
          echo "$RES"
          echo "$(date -u +%FT%TZ) $RES" > data/form_test.txt
          git config user.name "Black Sea Way bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/form_test.txt
          git commit -m "Contact form test result" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
